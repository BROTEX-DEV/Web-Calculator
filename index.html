<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#191919;color:white;font-family:"Segoe UI",Arial,sans-serif;display:flex;justify-content:center;align-items:center}
.calculator{width:360px;max-width:95vw;background:#202020;padding:18px;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
.title{font-size:16px;font-weight:600}.menu{font-size:20px;color:#aaa}
.display{width:100%;height:100px;background:#202020;border:none;outline:none;color:white;text-align:right;font-size:42px;font-weight:500;padding:10px;direction:ltr;overflow:hidden}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
button{height:64px;border:none;border-radius:6px;background:#323232;color:white;font-size:18px;cursor:pointer;transition:.12s}
button:hover{background:#414141}button:active{transform:scale(.96)}
.function{background:#2a2a2a}.operator{background:#323232;font-size:22px}
.equal{background:#76b9ed;color:#111;font-weight:bold}.equal:hover{background:#8ac6f1}
.zero{grid-column:span 2}.history{margin-top:12px;color:#888;font-size:13px;text-align:right;min-height:18px;overflow:hidden}
@media(max-width:400px){.calculator{width:100%;max-width:100%;min-height:100vh;border-radius:0;padding:14px}button{height:65px}.display{height:120px;font-size:38px}}
</style>
</head>
<body>
<div class="calculator">
<div class="top"><div class="title">Calculator</div><div class="menu">⋯</div></div>
<input id="display" class="display" type="text" value="0" readonly>
<div id="history" class="history"></div>
<div class="buttons">
<button class="function" data-action="percent">%</button><button class="function" data-action="ce">CE</button><button class="function" data-action="clear">C</button><button class="function" data-action="backspace">⌫</button>
<button data-number="7">7</button><button data-number="8">8</button><button data-number="9">9</button><button class="operator" data-operator="/">÷</button>
<button data-number="4">4</button><button data-number="5">5</button><button data-number="6">6</button><button class="operator" data-operator="*">×</button>
<button data-number="1">1</button><button data-number="2">2</button><button data-number="3">3</button><button class="operator" data-operator="-">−</button>
<button data-action="sign">±</button><button class="zero" data-number="0">0</button><button data-action="decimal">.</button>
<button class="operator" data-operator="+">+</button>
<button class="equal" data-action="equals" style="grid-column:span 4">=</button>
</div></div>
<script>
const display=document.getElementById("display"),historyDisplay=document.getElementById("history");
let current="0",previous=null,operator=null,waitingForNumber=false;
function updateDisplay(){display.value=current}
function inputNumber(n){if(waitingForNumber){current=n;waitingForNumber=false}else current=current==="0"?n:current+n;updateDisplay()}
function inputDecimal(){if(waitingForNumber){current="0.";waitingForNumber=false}else if(!current.includes("."))current+=".";updateDisplay()}
function clearAll(){current="0";previous=null;operator=null;waitingForNumber=false;historyDisplay.textContent="";updateDisplay()}
function clearEntry(){current="0";updateDisplay()}
function backspace(){if(waitingForNumber)return;current=current.length<=1?"0":current.slice(0,-1);updateDisplay()}
function toggleSign(){if(current==="0")return;current=current.startsWith("-")?current.slice(1):"-"+current;updateDisplay()}
function percent(){const v=parseFloat(current);if(!isNaN(v)){current=String(v/100);updateDisplay()}}
function calculate(a,b,op){a=Number(a);b=Number(b);if(op==="+")return a+b;if(op==="-")return a-b;if(op==="*")return a*b;if(op==="/")return b===0?null:a/b;return b}
function chooseOperator(next){const v=parseFloat(current);if(operator&&waitingForNumber){operator=next;return}if(previous===null)previous=v;else if(operator){const result=calculate(previous,v,operator);if(result===null){current="Error";previous=null;operator=null;waitingForNumber=true;updateDisplay();return}current=String(result);previous=result;updateDisplay()}operator=next;waitingForNumber=true;historyDisplay.textContent=`${previous} ${next}`}
function equals(){if(operator===null||previous===null)return;const v=parseFloat(current),result=calculate(previous,v,operator);if(result===null){current="Error";previous=null;operator=null;waitingForNumber=true;updateDisplay();historyDisplay.textContent="Cannot divide by zero";return}historyDisplay.textContent=`${previous} ${operator} ${v} =`;current=String(result);previous=null;operator=null;waitingForNumber=true;updateDisplay()}
document.querySelectorAll("[data-number]").forEach(b=>b.addEventListener("click",()=>inputNumber(b.dataset.number)));
document.querySelectorAll("[data-operator]").forEach(b=>b.addEventListener("click",()=>chooseOperator(b.dataset.operator)));
document.querySelectorAll("[data-action]").forEach(b=>b.addEventListener("click",()=>{const a=b.dataset.action;if(a==="clear")clearAll();if(a==="ce")clearEntry();if(a==="backspace")backspace();if(a==="decimal")inputDecimal();if(a==="percent")percent();if(a==="sign")toggleSign();if(a==="equals")equals()}));
document.addEventListener("keydown",e=>{const k=e.key;if(k>="0"&&k<="9"){inputNumber(k);return}if(k==="."){inputDecimal();return}if(["+","-","*","/"].includes(k)){chooseOperator(k);return}if(k==="Enter"||k==="="){e.preventDefault();equals();return}if(k==="Backspace"){backspace();return}if(k==="Escape"){clearAll();return}if(k==="%")percent()});
</script>
</body>
</html>
